<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      #tap-to-start {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.6);
        color: white;
        font-size: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 999;
        cursor: pointer;
      }
    </style>
  </head>
  <body>

    <div id="tap-to-start">Tap to Start</div>

    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.001; filterBeta: 0.01; warmupTolerance: 5; missTolerance: 5"
      color-space="sRGB"
      renderer="colorManagement: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-assets timeout="30000">
        <video id="video-0" src="./Rodri1080.mp4"    loop muted playsinline webkit-playsinline preload="auto"></video>
        <video id="video-1" src="./Salah1080.mp4"    loop muted playsinline webkit-playsinline preload="auto"></video>
        <video id="video-2" src="./久保1080.mp4"      loop muted playsinline webkit-playsinline preload="auto"></video>
        <video id="video-3" src="./CR1080.mp4"       loop muted playsinline webkit-playsinline preload="auto"></video>
        <video id="video-4" src="./messi1080.mp4"    loop muted playsinline webkit-playsinline preload="auto"></video>
        <video id="video-5" src="./Vini Jr1080.mp4"  loop muted playsinline webkit-playsinline preload="auto"></video>
        <video id="video-6" src="./Haaland1080.mp4"  loop muted playsinline webkit-playsinline preload="auto"></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- index 0: Rodri -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-video id="ar-vid-0" src="#video-0" position="0 0 0" width="1" height="1"></a-video>
      </a-entity>

      <!-- index 1: Salah -->
      <a-entity mindar-image-target="targetIndex: 1">
        <a-video id="ar-vid-1" src="#video-1" position="0 0 0" width="1" height="1"></a-video>
      </a-entity>

      <!-- index 2: Kubo -->
      <a-entity mindar-image-target="targetIndex: 2">
        <a-video id="ar-vid-2" src="#video-2" position="0 0 0" width="1" height="1"></a-video>
      </a-entity>

      <!-- index 3: CR7 -->
      <a-entity mindar-image-target="targetIndex: 3">
        <a-video id="ar-vid-3" src="#video-3" position="0 0 0" width="1" height="1"></a-video>
      </a-entity>

      <!-- index 4: Messi -->
      <a-entity mindar-image-target="targetIndex: 4">
        <a-video id="ar-vid-4" src="#video-4" position="0 0 0" width="1" height="1"></a-video>
      </a-entity>

      <!-- index 5: Vini -->
      <a-entity mindar-image-target="targetIndex: 5">
        <a-video id="ar-vid-5" src="#video-5" position="0 0 0" width="1" height="1"></a-video>
      </a-entity>

      <!-- index 6: Haaland -->
      <a-entity mindar-image-target="targetIndex: 6">
        <a-video id="ar-vid-6" src="#video-6" position="0 0 0" width="1" height="1"></a-video>
      </a-entity>

    </a-scene>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const tapScreen = document.getElementById("tap-to-start");
        const videos = [
          document.getElementById("video-0"),
          document.getElementById("video-1"),
          document.getElementById("video-2"),
          document.getElementById("video-3"),
          document.getElementById("video-4"),
          document.getElementById("video-5"),
          document.getElementById("video-6"),
        ];

        // 點擊解鎖所有影片（iOS 必須）
        tapScreen.addEventListener("click", () => {
          tapScreen.style.display = "none";
          videos.forEach(v => v.play().catch(e => console.log(e)));
        });

        const sceneEl = document.querySelector("a-scene");
        sceneEl.addEventListener("loaded", () => {
          const targets = document.querySelectorAll("[mindar-image-target]");
          const foundState = [false, false, false, false, false, false, false];

          targets.forEach((target, i) => {
            target.addEventListener("targetFound", () => {
              foundState[i] = true;
              videos[i].play().catch(e => console.log(e));
            });

            target.addEventListener("targetLost", () => {
              if (foundState[i]) {
                document.getElementById(`ar-vid-${i}`).setAttribute("visible", "true");
                target.object3D.visible = true;
              }
            });
          });
        });
      });
    </script>
  </body>
</html>
