<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      #tap-to-start {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.6);
        color: white;
        font-size: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 999;
        cursor: pointer;
      }
    </style>
  </head>
  <body>

    <!-- 點擊啟動畫面 -->
    <div id="tap-to-start">點擊畫面開始掃描</div>

    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.001; filterBeta: 0.01; warmupTolerance: 5; missTolerance: 5"
      color-space="sRGB"
      renderer="colorManagement: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-assets timeout="15000">
        <video id="ar-video" src="./Haaland1080.mp4"
               loop muted playsinline webkit-playsinline
               preload="auto">
        </video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-video id="ar-vid" src="#ar-video" position="0 0 0" width="1" height="1"></a-video>
      </a-entity>

    </a-scene>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const tapScreen = document.getElementById("tap-to-start");
        const video = document.getElementById("ar-video");

        // 點擊後隱藏遮罩，並解鎖影片播放
        tapScreen.addEventListener("click", () => {
          tapScreen.style.display = "none";
          video.play().catch(e => console.log(e));
        });

        const sceneEl = document.querySelector("a-scene");
        sceneEl.addEventListener("loaded", () => {
          const target = document.querySelector("[mindar-image-target]");
          let found = false;

          target.addEventListener("targetFound", () => {
            found = true;
            video.play().catch(e => console.log(e));
          });

          target.addEventListener("targetLost", () => {
            if (found) {
              document.getElementById("ar-vid").setAttribute("visible", "true");
              target.object3D.visible = true;
            }
          });
        });
      });
    </script>
  </body>
</html>
