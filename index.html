<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.001; filterBeta: 0.01; warmupTolerance: 5; missTolerance: 5"
      color-space="sRGB"
      renderer="colorManagement: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-assets timeout="10000">
        <video id="ar-video" src="./Haaland1080.mp4"
               autoplay loop muted playsinline
               webkit-playsinline
               preload="auto">
        </video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-video id="ar-vid" src="#ar-video" position="0 0 0" width="1" height="0.5625"></a-video>
      </a-entity>

    </a-scene>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const sceneEl = document.querySelector("a-scene");

        sceneEl.addEventListener("loaded", () => {
          const target = document.querySelector("[mindar-image-target]");
          let found = false;

          target.addEventListener("targetFound", () => {
            found = true;
            const video = document.getElementById("ar-video");
            video.play().catch(e => console.log("play error:", e));
          });

          target.addEventListener("targetLost", () => {
            if (found) {
              const arVid = document.getElementById("ar-vid");
              arVid.setAttribute("visible", "true");
              target.object3D.visible = true;
            }
          });
        });
      });
    </script>
  </body>
</html>
